<!DOCTYPE html>
<html>
<head><title>Log In</title></head>
<body>
    <h2>Log In</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>
    <p>Don't have an account? <a href="{% url 'register' %}">Sign up here</a>.</p>
</body>
</html>
